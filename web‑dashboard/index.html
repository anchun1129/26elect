<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="SameSite" content="None">
    <title>电动车乱停放监测看板</title>
    <script src="https://static.gtimg.com/cloud-base/sdk/1.10.0/cloudbase-web-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        body {
            padding:20px;
            background-color:#f5f7fa;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom:24px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding:24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .warn{
            color:#d93025;
            font-size:26px;
            font-weight:bold;
        }
        .normal{
            color:#28a745;
            font-size:26px;
            font-weight:bold;
        }
        .chart-wrap{
            width:450px;
            background:#fff;
            padding:20px;
            border-radius:12px;
        }
    </style>
</head>
<body>
    <h1>电动车乱停放监测系统</h1>

    <div class="container">
        <div class="card">
            <h3>今日检测总次数</h3>
            <p id="totalCount">--</p>
        </div>
        <div class="card">
            <h3>乱停放告警数量</h3>
            <p id="warnCount" class="warn">--</p>
        </div>
        <div class="card">
            <h3>正常停放数量</h3>
            <p id="safeCount" class="normal">--</p>
        </div>
        <div class="card">
            <h3>告警地点</h3>
            <p id="locationText">--</p>
        </div>
    </div>

    <div class="chart-wrap">
        <h3>今日停放情况占比</h3>
        <canvas id="pieChart"></canvas>
    </div>

    <h2 style="margin-top:24px">实时告警列表</h2>
    <div class="card" id="listWrap" style="width:95%;">
        <p>加载中...</p>
    </div>

<script>
const mockData = {
    total: 12,
    warnCount: 4,
    normalCount: 8,
    warnPlaces: ["1号楼道", "3号出入口"],
    latest5: [
        { status:"warn", time:"2026‑08‑06 14:23", content:"3号出入口检测到电动车违规停放" },
        { status:"warn", time:"2026‑08‑06 14:18", content:"1号楼道检测到电动车违规停放" },
        { status:"normal", time:"2026‑08‑06 14:10", content:"2号楼道停放合规" }
    ]
};

let pieChart = null;

function renderChart(data){
    // 使用 getElementById
    document.getElementById('totalCount').innerText = data.total ?? 0;
    document.getElementById('warnCount').innerText = data.warnCount ?? 0;
    document.getElementById('safeCount').innerText = data.normalCount ?? 0;

    const places = data.warnPlaces ?? [];
    document.getElementById('locationText').innerText = places.length>0 ? places.join('、') : "暂无";

    let html = "";
    const list = data.latest5 ?? [];
    list.forEach(item=>{
        const tag = item.status === "warn" ? "【告警】" : "【正常】";
        html += `<p>${tag} ${item.time} ${item.content}</p>`
    })
    document.getElementById('listWrap').innerHTML = html || "<p>暂无记录</p>";

    if(typeof Chart === 'undefined'){
        console.warn("Chart未加载，跳过饼图");
        return;
    }
    if(pieChart) pieChart.destroy();
    const ctx = document.getElementById('pieChart').getContext('2d');
    pieChart = new Chart(ctx,{
        type:'pie',
        data:{
            labels:['违规告警','正常停放'],
            datasets:[{
                data:[data.warnCount??0, data.normalCount??0],
                backgroundColor:['#d93025','#28a745']
            }]
        },
        options:{responsive:true}
    })
}

async function start(){
    if(!window.cloudbase){
        console.warn("SDK未加载，启用模拟数据");
        renderChart(mockData);
        return;
    }
    const app = window.cloudbase.init({
      env: "cloudbase-d6gsqrixe917ec638-1462376799",
      traceUser: true
});

    try{
        // Web云开发必须先执行匿名登录
        await app.auth().anonymousLogin();
        console.log("web匿名登录成功");

        const res = await app.callFunction({
            name:"dashboardStats",
            data:{}
        })
        console.log("云函数返回：",res.result);
        renderChart(res.result);
    }catch(err){
        console.error("调用失败，启用模拟数据",err);
        renderChart(mockData);
    }
}

setTimeout(()=>{
    start();
},600);
</script>
</body>
</html>
