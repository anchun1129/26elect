<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>电动车乱停放监测看板</title>
    <!-- 云开发 Web SDK CDN -->
    <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
    <script src="https://static.weixin.qq.com/cloud/js/cloud-web-sdk-v1.4.0.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <style>
        body {
            padding:20px;
            background-color:#f5f7fa;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom:30px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding:24px;
            box-shadow: 0 2px 8px #00000015;
        }
        .warn{
            color:#d93025;
            font-size:26px;
            font-weight:bold;
        }
        .normal{
            color:#28a745;
            font-size:26px;
            font-weight:bold;
        }
        .chart-wrap{
            width:450px;
            background:#fff;
            padding:20px;
            border-radius:12px;
        }
    </style>
</head>
<body>
    <h1>电动车乱停放监测系统</h1>

    <div class="container">
        <div class="card">
            <h3>今日检测总次数</h3>
            <p class="total-num">--</p>
        </div>

        <div class="card">
            <h3>乱停放告警数量</h3>
            <p class="warn-num warn">--</p>
        </div>

        <div class="card">
            <h3>正常停放数量</h3>
            <p class="normal-num normal">--</p>
        </div>

        <div class="card">
            <h3>告警地点</h3>
            <p class="place-text">--</p>
        </div>
    </div>

    <div class="chart-wrap">
        <h3>今日停放情况占比</h3>
        <canvas id="pieChart"></canvas>
    </div>

    <h2 style="margin-top:40px">实时告警列表</h2>
    <div class="card list-wrap" style="width:95%;">
        <p>加载中...</p>
    </div>

<script>
// 模拟数据，本地调试用；上线对接云函数注释掉mockData
const mockData = {
    total: 12,
    warnCount: 4,
    normalCount: 8,
    warnPlaces: ["1号楼道", "3号出入口"],
    latest5: [
        { status:"warn", time:"2026‑08‑06 14:23", content:"3号出入口检测到电动车违规停放" },
        { status:"warn", time:"2026‑08‑06 14:18", content:"1号楼道检测到电动车违规停放" },
        { status:"normal", time:"2026‑08‑06 14:10", content:"2号楼道停放合规" }
    ]
};

let pieChart = null;

async function loadBoardData(){
    /* =====真实云开发代码，配置完安全来源再打开=====
    wx.cloud.init({
      env: "cloudbase-d6gsqrixe917ec638"
    })
    const res = await wx.cloud.callFunction({name:"boardStat"})
    const data = res.result
    console.log("拿到统计数据", data)
    */
    const data = mockData;

    //填充卡片数字
    document.querySelector('.total-num').innerText = data.total
    document.querySelector('.warn-num').innerText = data.warnCount
    document.querySelector('.normal-num').innerText = data.normalCount
    document.querySelector('.place-text').innerText = data.warnPlaces.join('、')

    //渲染告警列表
    let htmlStr = ""
    data.latest5.forEach(item=>{
      const tag = item.status==='warn' ? '【告警】':'【正常】'
      htmlStr += `<p>${tag} ${item.time} ${item.content}</p>`
    })
    document.querySelector('.list-wrap').innerHTML = htmlStr

    //绘制Chart.js饼图
    if(pieChart) pieChart.destroy();
    const ctx = document.getElementById('pieChart').getContext('2d');
    pieChart = new Chart(ctx, {
        type:'pie',
        data:{
            labels:['违规告警','正常停放'],
            datasets:[{
                data:[data.warnCount, data.normalCount],
                backgroundColor:['#d93025','#28a745']
            }]
        },
        options:{responsive:true}
    })
}

window.onload = function(){
  loadBoardData()
}
</script>
</body>
</html>
