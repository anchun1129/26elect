<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>电动车乱停放监测看板</title>
    <script src="https://static.gtimg.com/cloud-base/sdk/1.10.0/cloudbase-web-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        body {
            padding:20px;
            background-color:#f5f7fa;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom:24px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding:24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .warn{
            color:#d93025;
            font-size:26px;
            font-weight:bold;
        }
        .normal{
            color:#28a745;
            font-size:26px;
            font-weight:bold;
        }
        .chart-wrap{
            width:450px;
            background:#fff;
            padding:20px;
            border-radius:12px;
        }
    </style>
</head>
<body>
    <h1>电动车乱停放监测系统</h1>

    <div class="container">
        <div class="card">
            <h3>今日检测总次数</h3>
            <p class="total-num">--</p>
        </div>
        <div class="card">
            <h3>乱停放告警数量</h3>
            <p class="warn-num warn">--</p>
        </div>
        <div class="card">
            <h3>正常停放数量</h3>
            <p class="normal-num normal">--</p>
        </div>
        <div class="card">
            <h3>告警地点</h3>
            <p class="place-text">--</p>
        </div>
    </div>

    <div class="chart-wrap">
        <h3>今日停放情况占比</h3>
        <canvas id="pieChart"></canvas>
    </div>

    <h2 style="margin-top:24px">实时告警列表</h2>
    <div class="card list-wrap" style="width:95%;">
        <p>加载中...</p>
    </div>

<script>
const mockData = {
    total: 12,
    warnCount: 4,
    normalCount: 8,
    warnPlaces: ["1号楼道", "3号出入口"],
    latest5: [
        { status:"warn", time:"2026‑08‑06 14:23", content:"3号出入口检测到电动车违规停放" },
        { status:"warn", time:"2026‑08‑06 14:18", content:"1号楼道检测到电动车违规停放" },
        { status:"normal", time:"2026‑08‑06 14:10", content:"2号楼道停放合规" }
    ]
};

let pieChart = null;

function renderChart(data){
    document.querySelector('.total-num').innerText = data.total;
    document.querySelector('.warn-num').innerText = data.warnCount;
    document.querySelector('.normal-num').innerText = data.normalCount;
    document.querySelector('.place-text').innerText = data.warnPlaces.join('、');

    let html = "";
    data.latest5.forEach(item=>{
      const tag = item.status === "warn" ? "【告警】" : "【正常】";
      html += `<p>${tag} ${item.time} ${item.content}</p>`
    })
    document.querySelector('.list-wrap').innerHTML = html;

    if(typeof Chart === 'undefined'){
        console.warn("Chart未加载，跳过饼图");
        return;
    }

    if(pieChart) pieChart.destroy();
    const ctx = document.getElementById('pieChart').getContext('2d');
    pieChart = new Chart(ctx,{
        type:'pie',
        data:{
            labels:['违规告警','正常停放'],
            datasets:[{
                data:[data.warnCount, data.normalCount],
                backgroundColor:['#d93025','#28a745']
            }]
        },
        options:{responsive:true}
    })
}

async function start(){
    // 如果云SDK不存在，直接用模拟数据
    if(!window.cloudbase){
        renderChart(mockData);
        return;
    }
    const app = window.cloudbase.init({
      env: "cloudbase-d6gsqrixe917ec638"
    });
    try{
        const res = await app.callFunction({
          name:"dashboardStats",
          data:{}
        })
        renderChart(res.result);
    }catch(err){
        console.log("云函数调用失败，启用模拟数据", err);
        renderChart(mockData);
    }
}

// 延迟一小段时间再启动，等待外部脚本加载
setTimeout(()=>{
    start();
}, 600);
</script>
</body>
</html>
